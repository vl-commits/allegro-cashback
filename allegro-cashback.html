<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cashback z zamówień na Allegro PL</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ff5a00'/><text x='50%25' y='73%25' font-family='Arial Black,sans-serif' font-size='22' font-weight='900' fill='white' text-anchor='middle'>a</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@600;700;800&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: #f5f5f5; color: #222; min-height: 100vh; }

  .header {
    background: #ff5a00;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 16px rgba(255,90,0,0.25);
    flex-wrap: wrap;
    gap: 12px;
  }
.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}
.header-logo {
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

.header-logo img {
    display: block;
    width: clamp(120px, 15vw, 210px);
    height: auto;
    max-width: 100%;
    object-fit: contain;
    filter: brightness(0) invert(1);
}

@media (max-width: 768px) {
    .header-logo img {
        width: 145px;
    }
}

@media (max-width: 480px) {
    .header-logo img {
        width: 110px;
    }
}

.header-title {
    color: #ffffff;
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: 0.01em;
    line-height: 1.2;
}

  /* LANG SWITCHER */
  .lang-switch {
    display: flex;
    align-items: center;
    gap: 0;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .lang-btn {
    padding: 8px 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    font-weight: 800;
    color: rgba(255,255,255,0.7);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    letter-spacing: 0.05em;
  }
  .lang-btn.active {
    background: #fff;
    color: #ff5a00;
    border-radius: 8px;
  }
  .lang-divider {
    color: rgba(255,255,255,0.4);
    font-size: 1rem;
    padding: 0 2px;
  }

  .search-wrap {
    background: #fff;
    border-bottom: 2px solid #ffe0cc;
    padding: 18px 32px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .search-inner { max-width: 700px; margin: 0 auto; position: relative; }
  .search-inner input {
    width: 100%;
    padding: 13px 48px 13px 20px;
    border: 2px solid #ff5a00;
    border-radius: 12px;
    font-size: 1rem;
    font-family: 'Nunito', sans-serif;
    outline: none;
    transition: box-shadow 0.2s;
    color: #222;
    background: #fff;
  }
  .search-inner input:focus { box-shadow: 0 0 0 3px rgba(255,90,0,0.18); }
  .search-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #ff5a00; pointer-events: none; }
  .search-count { text-align: center; margin-top: 8px; font-size: 0.82rem; color: #888; }

  .table-wrap { max-width: 1100px; margin: 28px auto 40px; padding: 0 16px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
  thead tr { background: #ff5a00; }
  thead th { color: #fff; font-weight: 800; padding: 14px 18px; text-align: left; font-size: 0.95rem; }
  thead th:first-child { width: 18%; }
  thead th:nth-child(2) { width: 52%; }
  thead th:nth-child(3) { width: 30%; }

  tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fff5ef; }
  tbody tr.hidden { display: none; }

  td { padding: 12px 18px; vertical-align: top; font-size: 0.92rem; line-height: 1.55; }
  td:first-child { font-weight: 700; color: #ff5a00; }
  td:nth-child(3) { font-weight: 700; color: #333; }

  .no-results { text-align: center; padding: 40px 20px; color: #aaa; font-size: 1.05rem; display: none; }

  .notice {
    max-width: 700px;
    margin: 0 auto 14px;
    font-style: italic;
    font-size: 0.85rem;
    color: #888;
    line-height: 1.5;
  }

  @media (max-width: 640px) {
    .header { padding: 14px 16px; }
    .header-title { font-size: 0.95rem; }
    .lang-btn { padding: 6px 14px; font-size: 0.85rem; }
    .search-wrap { padding: 12px 10px; }
    .table-wrap { padding: 0 4px; }
    td, thead th { padding: 9px 8px; font-size: 0.8rem; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
   <div class="header-logo">
    <img src="allegro-logo.png" alt="Allegro">
</div>
    <div class="header-title" id="headerTitle">Cashback z zamówień na Allegro PL</div>
  </div>
  <div class="lang-switch">
    <button class="lang-btn active" id="btnPL" onclick="setLang('pl')">PL</button>
    <span class="lang-divider">|</span>
    <button class="lang-btn" id="btnUA" onclick="setLang('ua')">UA</button>
  </div>
</div>

<div class="search-wrap">
  <p class="notice" id="noticeText"></p>
  <div class="search-inner">
    <input type="text" id="searchInput" placeholder="Wpisz nazwę kategorii lub produktu…" autocomplete="off" />
    <svg class="search-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
  </div>
  <div class="search-count" id="searchCount"></div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th id="thCat">Kategoria</th>
        <th id="thSub">Podkategoria</th>
        <th id="thRate">Cashback</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="no-results" id="noResults">Brak wyników dla podanej frazy.</div>
</div>

<script>
var dataPL = [];
var dataUA = [];

const SHEET_PL_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSjPxUVHWnK42N2_o7m4qRXo6NzAAII-eYrpZ4sxvHvupqV1s26TZWEKSnbNMsUA1OijNJDj1KpybQp/pub?gid=0&single=true&output=csv';
const SHEET_UA_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSjPxUVHWnK42N2_o7m4qRXo6NzAAII-eYrpZ4sxvHvupqV1s26TZWEKSnbNMsUA1OijNJDj1KpybQp/pub?gid=2145018472&single=true&output=csv';
  function parseCSV(csvText) {
  const rows = [];
  let row = [];
  let cell = '';
  let insideQuotes = false;

  for (let i = 0; i < csvText.length; i++) {
    const char = csvText[i];
    const nextChar = csvText[i + 1];

    if (char === '"' && insideQuotes && nextChar === '"') {
      cell += '"';
      i++;
    } else if (char === '"') {
      insideQuotes = !insideQuotes;
    } else if (char === ',' && !insideQuotes) {
      row.push(cell.trim());
      cell = '';
    } else if ((char === '\n' || char === '\r') && !insideQuotes) {
      if (char === '\r' && nextChar === '\n') {
        i++;
      }

      row.push(cell.trim());

      if (row.some(value => value !== '')) {
        rows.push(row);
      }

      row = [];
      cell = '';
    } else {
      cell += char;
    }
  }

  if (cell !== '' || row.length > 0) {
    row.push(cell.trim());

    if (row.some(value => value !== '')) {
      rows.push(row);
    }
  }

  return rows;
}
  async function loadSheetData(url) {
  const response = await fetch(url, {
    cache: 'no-store'
  });

  if (!response.ok) {
    throw new Error('Nie udało się pobrać danych z Google Sheets.');
  }

  const csvText = await response.text();
  const rows = parseCSV(csvText);

  // Видаляємо перший рядок із назвами колонок
  return rows
    .slice(1)
    .filter(row => row.length >= 3)
    .map(row => [
      row[0] || '',
      row[1] || '',
      row[2] || ''
    ]);
}
  async function loadAllData() {
  const tbody = document.getElementById('tableBody');

  tbody.innerHTML = `
    <tr>
      <td colspan="3" style="text-align:center; padding:30px;">
        Ładowanie danych…
      </td>
    </tr>
  `;

  try {
    const results = await Promise.all([
      loadSheetData(SHEET_PL_URL),
      loadSheetData(SHEET_UA_URL)
    ]);

    dataPL = results[0];
    dataUA = results[1];

    setLang(currentLang);
  } catch (error) {
    console.error(error);

    tbody.innerHTML = `
      <tr>
        <td colspan="3" style="text-align:center; padding:30px; color:#b00020;">
          Nie udało się załadować danych z Google Sheets.
        </td>
      </tr>
    `;
  }
}

// Added excluded categories (UA)
// End added excluded categories (UA)

var currentLang = 'pl';

var i18n = {
  pl: {
    title: 'Cashback z zamówień na Allegro PL',
    placeholder: 'Wpisz nazwę kategorii lub produktu…',
    thCat: 'Kategoria',
    thSub: 'Podkategoria',
    thRate: 'Stawka cashback',
    noResults: 'Brak wyników dla podanej frazy.',
    notice: 'Zwróć uwagę, że czasem wysokość cashbacku może różnić się od tabeli kategorii, ponieważ zależy od warunków współpracy sprzedawców na platformie Allegro. Również przy aktywacji gorącego cashbacku procent zwrotu rośnie zgodnie z mnożnikiem. Cookie lifetime 24h. To oznacza, że zakupy dokonane po upływie 24 godzin od momentu aktywacji cashbacku nie zostaną przypisane.',
    found: function(v, t) { return 'Znaleziono: ' + v + ' z ' + t + ' wierszy'; }
  },
  ua: {
    title: 'Кешбек із замовлень на Allegro PL',
    placeholder: 'Введіть назву категорії або товару…',
    thCat: 'Категорія',
    thSub: 'Підкатегорія',
    thRate: 'Кешбек',
    noResults: 'Результатів не знайдено.',
    notice: 'Зверни увагу, що іноді розмір кешбеку може відрізнятися від наведених у таблиці значень, оскільки він залежить від умов співпраці продавців на платформі Allegro. Крім того, при активації Гарячого кешбеку відсоток збільшується відповідно до коефіцієнта. Life time cookie — 24 години. Це означає, що покупки, здійснені через 24 години після активації кешбеку, не будуть зараховані.',
    found: function(v, t) { return 'Знайдено: ' + v + ' з ' + t + ' рядків'; }
  }
};

function renderTable(data) {
  var tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  var lastCat = null;
  for (var i = 0; i < data.length; i++) {
    var row = data[i];
    var tr = document.createElement('tr');
    if (row[0] !== lastCat) {
      tr.style.borderTop = '2px solid #ffe0cc';
      lastCat = row[0];
    }
    var td0 = document.createElement('td');
    var td1 = document.createElement('td');
    var td2 = document.createElement('td');
    td0.textContent = row[0].replace(/^"|"$/g, '');
    td1.textContent = row[1];
    td2.textContent = row[2];
    tr.appendChild(td0);
    tr.appendChild(td1);
    tr.appendChild(td2);
    tbody.appendChild(tr);
  }
}

function setLang(lang) {
  currentLang = lang;

  var t = i18n[lang];

  document.getElementById('headerTitle').textContent = t.title;
  document.getElementById('searchInput').placeholder = t.placeholder;
  document.getElementById('thCat').textContent = t.thCat;
  document.getElementById('thSub').textContent = t.thSub;
  document.getElementById('thRate').textContent = t.thRate;
  document.getElementById('noResults').textContent = t.noResults;
  document.getElementById('noticeText').textContent = t.notice;

  document.getElementById('btnPL').className =
    'lang-btn' + (lang === 'pl' ? ' active' : '');

  document.getElementById('btnUA').className =
    'lang-btn' + (lang === 'ua' ? ' active' : '');

  document.getElementById('searchInput').value = '';
  document.getElementById('searchCount').textContent = '';

  renderTable(lang === 'pl' ? dataPL : dataUA);
}

// Search
document.getElementById('searchInput').addEventListener('input', function() {
  var q = this.value.trim().toLowerCase();
  var tbody = document.getElementById('tableBody');
  var rows = tbody.querySelectorAll('tr');
  var visible = 0;
  var t = i18n[currentLang];

  for (var i = 0; i < rows.length; i++) {
    var tr = rows[i];
    var combined = (tr.children[0].textContent + ' ' + tr.children[1].textContent + ' ' + tr.children[2].textContent).toLowerCase();
    if (!q || combined.indexOf(q) !== -1) {
      tr.classList.remove('hidden');
      visible++;
    } else {
      tr.classList.add('hidden');
    }
  }

  document.getElementById('noResults').style.display = (visible === 0) ? 'block' : 'none';
  document.getElementById('searchCount').textContent = q ? t.found(visible, rows.length) : '';
});

// Init
loadAllData();
</script>
</body>
</html>
